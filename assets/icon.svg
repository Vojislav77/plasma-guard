<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Light blue side (left) -->
    <linearGradient id="leftSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CFE0F0"/>
      <stop offset="100%" stop-color="#A2C5E2"/>
    </linearGradient>
    <!-- Dark blue side (right) -->
    <linearGradient id="rightSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DA0E0"/>
      <stop offset="100%" stop-color="#1B73B8"/>
    </linearGradient>
    <!-- Subtle top sheen -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- LEFT HALF (light) -->
  <path d="
    M 256 48
    Q 256 48 168 64
    Q 110 72 76 78
    L 60 82
    Q 60 90 60 110
    Q 60 250 110 350
    Q 160 440 256 480
    L 256 48
    Z
  " fill="url(#leftSide)"/>

  <!-- RIGHT HALF (dark) -->
  <path d="
    M 256 48
    L 256 480
    Q 352 440 402 350
    Q 452 250 452 110
    Q 452 90 452 82
    L 436 78
    Q 402 72 344 64
    Q 256 48 256 48
    Z
  " fill="url(#rightSide)"/>

  <!-- Top sheen on left half -->
  <path d="
    M 256 48
    Q 256 48 168 64
    Q 110 72 76 78
    L 60 82
    Q 60 100 64 180
    L 80 80
    Q 130 72 168 68
    Q 220 60 256 56
    L 256 48
    Z
  " fill="url(#sheen)"/>

  <!-- Top sheen on right half -->
  <path d="
    M 256 48
    L 256 56
    Q 292 60 344 68
    Q 382 72 432 80
    L 448 180
    Q 452 100 452 82
    L 436 78
    Q 402 72 344 64
    Q 256 48 256 48
    Z
  " fill="url(#sheen)"/>

  <!-- Subtle vertical seam -->
  <line x1="256" y1="48" x2="256" y2="480" stroke="#0D4F7F" stroke-width="1.2" stroke-opacity="0.4"/>
</svg>
